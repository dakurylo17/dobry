<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Каталог, Dobry Market Groningen</title>
  <meta name="description" content="Каталог Dobry Market: солодощі Roshen, ковбаси, сало, чипси «Люкс», сухарики «Флінт», насіння, в'ялена риба, морозиво, пиво «Львівське», Non Stop, соки «Садочок».">
  <meta name="theme-color" content="#1f45b5">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='16' fill='%231f45b5'/%3E%3Crect y='16' width='32' height='16' fill='%23ffcc1a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="catalog">
  <div id="site-header"></div>

  <main id="main">
    <section class="page-head">
      <div class="wrap">
        <h1 data-i18n="catalog_title">Каталог</h1>
        <p id="catalog-lead"></p>
      </div>
    </section>
    <div class="band" aria-hidden="true"></div>

    <div class="filters">
      <div class="wrap">
        <div class="filters__row">
          <label class="search">
            <span class="visually-hidden" data-i18n="search_label">Пошук товару</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
            <input id="q" type="search" autocomplete="off" data-i18n-ph="search_ph">
          </label>
          <label>
            <span class="visually-hidden" data-i18n="country">Країна</span>
            <select class="select" id="country"></select>
          </label>
          <label>
            <span class="visually-hidden" data-i18n="sort">Сортування</span>
            <select class="select" id="sort"></select>
          </label>
          <label class="toggle">
            <input type="checkbox" id="hits-only">
            <span data-i18n="hits_only">Лише хіти</span>
          </label>
        </div>
        <div class="chips" id="chips" role="group" data-i18n-label="nav_catalog"></div>
      </div>
    </div>

    <section class="wrap" aria-labelledby="found">
      <div class="results-bar"><span id="found" role="status"></span></div>
      <ul class="shelf" id="grid"></ul>
      <div class="empty" id="empty" hidden>
        <h2 data-i18n="empty_title">Нічого не знайшли</h2>
        <p data-i18n="empty_text">Спробуйте іншу назву або скиньте фільтри.</p>
        <button class="btn btn--ink" type="button" id="reset" data-i18n="reset">Скинути фільтри</button>
      </div>
      <div style="height:clamp(48px,7vw,88px)"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/products.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/packs.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
